name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in 14 15 16 17 18; do
            for p in en.wikipedia/all-access; do
              c=$(curl -s -o /tmp/b -w "%{http_code}" -A "pipeobs-probe" https://wikimedia.org/api/rest_v1/metrics/pageviews/top/$p/2026/10/$d)
              echo "::notice::top $d -> $c $(head -c 150 /tmp/b | tr '\n' ' ')"
            done
            c=$(curl -s -o /tmp/b -w "%{http_code}" -A "pipeobs-probe" https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/en.wikipedia/all-access/user/daily/202610${d}00/202610${d}00)
            echo "::notice::aggregate $d -> $c $(head -c 120 /tmp/b | tr '\n' ' ')"
          done
