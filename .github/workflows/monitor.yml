name: monitor
# Every 3 hours: fetch each feed, run the monitors, commit the history and status, and sync incident issues.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Replay this many past days for every source (0 = normal run)"
        default: "0"
permissions:
  contents: write
  issues: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Run the monitors
        run: |
          if [ "${{ github.event.inputs.backfill || '0' }}" != "0" ]; then
            pipeobs run --backfill "${{ github.event.inputs.backfill }}"
          fi
          pipeobs run --backfill-if-empty 30
      - name: Build the status document
        run: pipeobs status -o status/latest.json
      - name: Commit history and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history status
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "monitor run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 5; done
      - name: Sync incident issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipeobs alert --status status/latest.json
